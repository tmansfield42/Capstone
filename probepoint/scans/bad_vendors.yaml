# ProbePoint — Known-bad IoT vendor database
# Consumed by iot_scanner.py check_bad_vendor()
#
# Tier meanings:
#   critical — regulatory prohibition (NDAA 889 / FCC Covered List) or
#              well-documented backdoor. Should be treated as uninsurable
#              or flagged for manual underwriting review.
#   high     — chronic security track record, Mirai-era notoriety, or
#              vendor is commonly compromised in the wild.
#   medium   — vendor has produced insecure products historically but
#              also ships secure modern lines; context-dependent risk.
#
# Matching signals (per check_bad_vendor):
#   mac_prefixes   — IEEE OUI assignments for the vendor (uppercase, colon form)
#   name_patterns  — substrings matched against vendor string, UPnP
#                    manufacturer/modelName, HTTP title
#   banner_patterns — substrings matched against HTTP Server headers
#                     and embedded webserver identifiers
#
# 1 signal = low confidence (flagged), 2+ = high confidence (confirmed).

version: "1.0"
